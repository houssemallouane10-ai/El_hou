name: Android app

# Builds the Barmaj Android app (barmaj/android, a Trusted Web Activity that
# opens the site full screen) and pushes the unsigned APK to the
# android-build branch. It is signed with barmaj/tools/sign-apk.mjs and
# published as barmaj/download/Barmaj.apk.
on:
  push:
    paths:
      - 'barmaj/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the release APK (unsigned)
        working-directory: barmaj/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Push the APK to the android-build branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp barmaj/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/out/barmaj-unsigned.apk"
          cd "$RUNNER_TEMP/out"
          printf 'Unsigned Barmaj APK built from %s (%s).\nSign it with barmaj/tools/sign-apk.mjs.\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > README.md
          git init -q -b android-build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -qm "Unsigned APK from $GITHUB_SHA"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android-build
