name: Deploy site

# Publishes the site to GitHub Pages on every push to main. Every 5 minutes
# it also refreshes the match data the site reads (data/fixtures.json and
# data/summary/, from ESPN) and data/highlights.json (official highlight
# videos), redeploying only when something changed.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.highlights.outputs.changed == 'true' || steps.fixtures.outputs.changed == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stamp the Barmaj service worker
        run: node barmaj/tools/stamp.mjs

      - id: pages
        uses: actions/configure-pages@v5

      - id: fixtures
        name: Fetch fixtures and scores
        env:
          PREVIOUS_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/fixtures.mjs

      - id: highlights
        name: Find highlights
        env:
          PREVIOUS_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/highlights.mjs

      # GitHub's branch-based Pages build also deploys every push, without the
      # match data. Wait until it has finished so this deployment lands last.
      - name: Wait for the branch build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")][0].status // "none"')
            echo "branch build: $state"
            if [ "$state" = "completed" ]; then exit 0; fi
            if [ "$state" = "none" ] && [ "$i" -gt 6 ]; then exit 0; fi
            sleep 10
          done

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.highlights.outputs.changed == 'true' || steps.fixtures.outputs.changed == 'true'
        with:
          path: .

  deploy:
    needs: build
    if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
