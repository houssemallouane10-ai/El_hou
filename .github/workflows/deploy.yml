name: Deploy site

# Publishes the site to GitHub Pages on every push to main, and every
# 20 minutes refreshes data/highlights.json (official highlight videos for
# finished matches), redeploying only when something new was found.
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.highlights.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - id: highlights
        name: Find highlights
        env:
          PREVIOUS_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/highlights.mjs

      # The repo's branch-based Pages build also runs on push; let it finish
      # first so this deployment (with highlights) is the one that stays live
      - name: Wait for the branch build
        if: github.event_name == 'push'
        run: sleep 75

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.highlights.outputs.changed == 'true'
        with:
          path: .

  deploy:
    needs: build
    if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
