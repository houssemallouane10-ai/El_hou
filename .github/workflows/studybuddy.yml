name: StudyBuddy

# Checks the DZ-StudyBuddy Flutter app (studybuddy/): analysis and tests,
# the Firestore and Realtime Database security rules against the
# emulators, and a debug Android build. The APK is kept as an artifact.
on:
  push:
    paths:
      - 'studybuddy/**'
      - '.github/workflows/studybuddy.yml'
  pull_request:
    paths:
      - 'studybuddy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studybuddy-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: studybuddy

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Security rules on the emulators
        working-directory: studybuddy/rules_test
        run: |
          npm ci
          npm test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: studybuddy-debug-apk
          path: studybuddy/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
