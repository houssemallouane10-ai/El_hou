# One-click hosting on Render (https://render.com), used by the "Deploy to Render" button.
# A web service with a 1 GB persistent disk for the SQLite database and its daily backups.
# Persistent disks need a paid instance type: "starter" is the smallest one.
services:
  - type: web
    name: khedmati
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: khedmati-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "1"
      # The secret that makes you the owner: copy it from the service's Environment tab and enter
      # it in the app when you sign up ("I own this platform").
      - key: OWNER_CODE
        generateValue: true
      # Shown in the privacy and account deletion pages (Google Play wants a contact).
      - key: SUPPORT_EMAIL
        sync: false
      - key: ANDROID_PACKAGE_NAME
        value: dz.khedmati.app
