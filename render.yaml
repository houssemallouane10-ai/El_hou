# One-click hosting on Render (https://render.com), used by the "Deploy to Render" button.
# A web service with a 1 GB persistent disk for the SQLite database and its daily backups.
# Persistent disks need a paid instance type: "starter" is the smallest one.
# Nothing to fill in: the first account created on the site becomes its owner, and the owner sets
# the support contact and the Android app from the admin console (Settings).
services:
  - type: web
    name: khedmati
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: khedmati-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "1"
